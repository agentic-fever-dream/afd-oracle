name: Release

# Push a tag like v0.2.0 to build, sign and publish a GitHub release.
# Run manually (workflow_dispatch) for a dry run: everything except publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1

  build:
    name: Build packages
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/afd_oracle_ui/web/package-lock.json
      - name: Build the dashboard into afd_oracle_ui/static
        working-directory: packages/afd_oracle_ui/web
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Build wheels and sdists
        run: uv build --all-packages --out-dir dist
      - name: Check the dashboard is inside the UI wheel
        run: unzip -l dist/afd_oracle_ui-*.whl | grep -q 'afd_oracle_ui/static/index.html'
      - name: Sign artifacts
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT" ]; then
            echo "::warning::SIGNING_CERT secret is not set; artifacts are published unsigned (provenance attestation still applies)."
            exit 0
          fi
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          echo "$SIGNING_CERT" | base64 -d > "$key_dir/cert.pfx"
          openssl pkcs12 -in "$key_dir/cert.pfx" -passin env:SIGNING_CERT_PASSWORD -nokeys -clcerts -out "$key_dir/cert.pem"
          openssl pkcs12 -in "$key_dir/cert.pfx" -passin env:SIGNING_CERT_PASSWORD -nocerts -nodes -out "$key_dir/key.pem"
          cp "$key_dir/cert.pem" dist/signing-cert.pem
          for f in dist/*.whl dist/*.tar.gz; do
            openssl cms -sign -binary -in "$f" -signer "$key_dir/cert.pem" -inkey "$key_dir/key.pem" \
              -outform DER -out "$f.p7s"
            openssl cms -verify -binary -inform DER -in "$f.p7s" -content "$f" -noverify > /dev/null
          done
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
