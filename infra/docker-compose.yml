# Local stack for the Oracle knowledge base. Bound to loopback only.
# Usage (from repo root):  docker compose -f infra/docker-compose.yml up -d
name: afd-oracle
services:
  neo4j:
    image: neo4j:5.26-community   # 5.26 LTS line; pin the exact patch you pull (docker image inspect)
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH in infra/.env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
      NEO4J_db_transaction_timeout: 60s
    volumes: ["../data/neo4j:/data", "../data/neo4j-logs:/logs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes: ["../data/qdrant:/qdrant/storage"]
    restart: unless-stopped
