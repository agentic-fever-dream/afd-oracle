[project]
name = "afd-oracle-ui"
version = "0.1.0"
description = "Local dashboard: add, ingest, mine and browse repositories in the Oracle knowledge base"
requires-python = ">=3.12"
dependencies = [
  "afd-oracle-core",
  "afd-oracle-ingest",
  "afd-oracle-mcp",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
afd-oracle-ui = "afd_oracle_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afd_oracle_ui"]
# The built dashboard is gitignored; ship it anyway (CI builds it before packaging).
artifacts = ["afd_oracle_ui/static/**"]
