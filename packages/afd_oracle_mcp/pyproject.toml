[project]
name = "afd-oracle-mcp"
version = "0.1.0"
description = "FastMCP server exposing the Oracle knowledge base to Claude Code"
requires-python = ">=3.12"
dependencies = [
  "afd-oracle-core",
  "afd-oracle-ingest",
  "fastmcp>=2.3,<3",
]

[project.scripts]
afd-oracle-mcp = "afd_oracle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afd_oracle_mcp"]
