[project]
name = "afd-oracle-ingest"
version = "0.1.0"
description = "Deterministic Git + tree-sitter ingestion, co-change, metrics, embeddings and work packets"
requires-python = ">=3.12"
dependencies = [
  "jedi>=0.19",
  "afd-oracle-core[fastembed]",
  "pygit2>=1.15",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "networkx>=3.3",
  "typer>=0.12",
]

[project.scripts]
afd-oracle = "afd_oracle_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afd_oracle_ingest"]
