[project]
name = "afd-oracle"
version = "0.1.0"
description = "Local Oracle knowledge base (Git history + AST -> Neo4j/Qdrant -> Claude Code workflows)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["afd-oracle-core", "afd-oracle-ingest", "afd-oracle-mcp", "afd-oracle-ui"]

[tool.uv]
package = false

[tool.uv.sources]
afd-oracle-core = { workspace = true }
afd-oracle-ingest = { workspace = true }
afd-oracle-mcp = { workspace = true }
afd-oracle-ui = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "neo4j: needs a running Neo4j (docker compose); skipped when unreachable",
  "qdrant_server: needs a running Qdrant server; skipped when unreachable",
]
